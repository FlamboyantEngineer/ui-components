name: CI

# Pushes to the long-lived branches and every pull request, each run once: a pull request from this
# repository or a fork runs on its pull_request event, not again on its branch push.
on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # scripts/check.mjs is the one list of gates, shared with `npm run check` locally: lint,
      # format, types, references, specs, labs, structure, client boundaries, builds, unit tests,
      # public types against the real build, the labs archive and the package contents.
      - name: Checks
        run: npm run check

  git-install:
    # A clean consumer installs the commit as a Git dependency through npm install and npm ci, with
    # the minimum supported React, then the rich-text peers (scripts/check-git-install.mjs).
    # It runs when a change can reach installation: the manifest, lockfile, build setup, entry points or
    # the reference stylesheet the package ships.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            install:
              - package.json
              - package-lock.json
              - .nvmrc
              - tsconfig.json
              - tsconfig.build.json
              - scripts/clean.mjs
              - scripts/check-git-install.mjs
              - src/index.ts
              - src/*/index.ts
              - src/components/*/index.ts
              - src/core/locales/**
              - labs/reference.css
              - labs/reference/**
              - scripts/prepare.mjs
              - scripts/copy-locales.mjs
              - scripts/build-labs.mjs
              - scripts/lib/**
              - .github/workflows/ci.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.install == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from Git
        if: steps.changes.outputs.install == 'true'
        run: npm ci && npm run check:git-install

  server-components:
    # An installed-package Next.js consumer: production build, server rendering and hydration.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Server components consumer
        run: npm run check:server-components

  labs-build:
    # The labs are built once; the browser jobs restore the build from the cache.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build labs
        run: npm run build:labs
      # Saved under this commit, so the browser jobs of this run restore exactly this build.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: labs/build/
          key: labs-build-${{ github.sha }}

  labs:
    # The lab browser suite runs in shards beside the check job so it fits the time budget. The
    # Chromium shards and the WebKit job each install only their own browser, from a cache keyed by
    # the Playwright version. CI records no traces; rerun a failing test locally with --trace=on.
    needs: labs-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1 of 3, browser: chromium, args: --project=chromium --shard=1/3 }
          - { name: chromium 2 of 3, browser: chromium, args: --project=chromium --shard=2/3 }
          - { name: chromium 3 of 3, browser: chromium, args: --project=chromium --shard=3/3 }
          - { name: webkit, browser: webkit, args: --project=webkit --project=mobile-webkit }
    name: labs (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: labs/build/
          key: labs-build-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install Playwright browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Lab browser tests (${{ matrix.name }})
        run: npx playwright test ${{ matrix.args }}
