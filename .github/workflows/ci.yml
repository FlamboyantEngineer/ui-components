name: CI

# Pushes to the long-lived branches and every pull request, each run once: a pull request from this
# repository or a fork runs on its pull_request event, not again on its branch push.
on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    # A push to dev or main whose tree is the tree of a merged pull request's head, which already
    # passed this whole workflow, reuses that result: every other job is skipped and `check` passes.
    # Strict branch rules make the head hold the base before it merges, so the pull request run
    # tested this exact tree. Any other push, and every pull request, runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - name: Find a passed run of this tree
        id: find
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at) | .head.sha'); do
            test "$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)" = "$tree" || continue
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq '.workflow_runs[0].html_url // empty')
            if test -n "$run"; then
              echo "::notice::This tree passed in $run"
              echo passed=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

  gates:
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # scripts/check.mjs is the one list of gates, shared with `npm run check` locally: format,
      # types, references, specs, labs, structure, client boundaries, builds, public types against
      # the real build, the labs archive and the package contents. Lint, the longest gate, runs in
      # its own job and the unit tests in the unit job's shards, both beside it.
      - name: Checks
        run: npm run check -- --skip lint --skip test

  lint:
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Two lint workers halve the type-aware lint on the runner's four cores; four run out of memory.
      - name: Lint
        run: npm run lint -- --concurrency=2

  unit:
    # The unit tests, the longest check, split across runners so the required check finishes sooner.
    # Some tests read the built package, so each shard builds it first.
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit (${{ matrix.shard }} of 3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:package
      - name: Unit tests (${{ matrix.shard }} of 3)
        run: npx vitest run --shard=${{ matrix.shard }}/3

  check:
    # The status the dev branch rules require: it passes only when the gates, lint and every unit
    # test shard passed, so a failed, cancelled or skipped job fails it, unless `reuse` found that
    # this tree already passed.
    if: ${{ !cancelled() }}
    needs: [reuse, gates, lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gates, lint and unit tests passed
        env:
          REUSED: ${{ needs.reuse.outputs.passed }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$REUSED" = true && exit 0
          for result in $RESULTS; do test "$result" = success || exit 1; done

  git-install:
    # A clean consumer installs the commit as a Git dependency through npm install and npm ci, with
    # the minimum supported React, then the rich-text peers (scripts/check-git-install.mjs).
    # It runs when a change can reach installation: the manifest, lockfile, build setup, entry points or
    # the reference stylesheet the package ships.
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            install:
              - package.json
              - package-lock.json
              - .nvmrc
              - tsconfig.json
              - tsconfig.build.json
              - scripts/clean.mjs
              - scripts/check-git-install.mjs
              - src/index.ts
              - src/*/index.ts
              - src/components/*/index.ts
              - src/core/locales/**
              - labs/reference.css
              - labs/reference/**
              - scripts/prepare.mjs
              - scripts/copy-locales.mjs
              - scripts/build-labs.mjs
              - scripts/lib/**
              - tooling/**
              - .github/workflows/ci.yml
              - .github/actions/setup/**
      - uses: ./.github/actions/setup
        if: steps.changes.outputs.install == 'true'
      - name: Install from Git
        if: steps.changes.outputs.install == 'true'
        run: npm run check:git-install

  server-components:
    # An installed-package Next.js consumer: production build, server rendering and hydration.
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
          cache-name: chromium
      - name: Server components consumer
        run: npm run check:server-components

  labs:
    # The lab browser suite runs in shards beside the check job so it fits the time budget. Each job
    # builds the labs itself, which takes seconds. The Chromium shards split the tests by their
    # measured time (scripts/lab-shards.mjs); WebKit and Firefox share one job. Each job installs
    # only its own browsers (.github/actions/playwright). CI records no traces; rerun a failing
    # test locally with --trace=on.
    needs: reuse
    if: needs.reuse.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1 of 6, browsers: chromium, shard: 1 }
          - { name: chromium 2 of 6, browsers: chromium, shard: 2 }
          - { name: chromium 3 of 6, browsers: chromium, shard: 3 }
          - { name: chromium 4 of 6, browsers: chromium, shard: 4 }
          - { name: chromium 5 of 6, browsers: chromium, shard: 5 }
          - { name: chromium 6 of 6, browsers: chromium, shard: 6 }
          - { name: webkit and firefox, browsers: webkit firefox }
    name: labs (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build labs
        run: npm run build:labs
      - uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.browsers }}
          cache-name: ${{ matrix.shard && 'chromium' || 'webkit-firefox' }}
      - name: Lab browser tests (${{ matrix.name }})
        if: matrix.shard
        run: |
          node scripts/lab-shards.mjs plan --project chromium --shards 6 --shard ${{ matrix.shard }} --out "$RUNNER_TEMP/shard.txt"
          npx playwright test --project=chromium --test-list "$RUNNER_TEMP/shard.txt"
      - name: Lab browser tests (${{ matrix.name }})
        if: ${{ !matrix.shard }}
        run: npx playwright test --project=webkit --project=mobile-webkit --project=firefox
