name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pushes cover branches in this repository; pull requests only add runs for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # scripts/check.mjs is the one list of gates, shared with `npm run check` locally: lint,
      # format, types, references, specs, labs, structure, client boundaries, builds, unit tests,
      # public types against the real build, the labs archive and the package contents.
      - name: Checks
        run: npm run check

  git-install:
    # A clean consumer installs the commit as a Git dependency through npm install and npm ci, with
    # the minimum supported React, then the rich-text peers (scripts/check-git-install.mjs).
    # It runs when a change can reach installation: the manifest, lockfile, build setup, entry points or
    # the reference stylesheet the package ships.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            install:
              - package.json
              - package-lock.json
              - .nvmrc
              - tsconfig.json
              - tsconfig.build.json
              - scripts/clean.mjs
              - scripts/check-git-install.mjs
              - src/index.ts
              - src/*/index.ts
              - src/components/*/index.ts
              - src/core/locales/**
              - labs/reference.css
              - labs/reference/**
              - scripts/build-labs.mjs
              - scripts/lib/reference-stylesheet.mjs
              - .github/workflows/ci.yml
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.install == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from Git
        if: steps.changes.outputs.install == 'true'
        run: npm ci && npm run check:git-install

  server-components:
    # An installed-package Next.js consumer: production build, server rendering and hydration.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Server components consumer
        run: npm run check:server-components

  labs:
    # The lab browser suite runs in shards beside the check job so it fits the time budget.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build labs
        run: npm run build:labs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit
      - name: Lab browser tests (shard ${{ matrix.shard }} of 3)
        run: npx playwright test --shard=${{ matrix.shard }}/3
